version: '3.8'

services:
  # Backend Flask REST API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agri_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PORT=5000
      - SECRET_KEY=farmer_super_secret_jwt_key_2026_prod
      - JWT_SECRET_KEY=farmer_jwt_signing_key_secure_prod
      - DEMO_MODE=true
      - SQLALCHEMY_DATABASE_URI=sqlite:////app/database/farmer_advisory.db
    volumes:
      - backend_data:/app/database
      - backend_uploads:/app/uploads
    networks:
      - agri_network

  # Frontend React SPA Service with Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agri_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - agri_network

volumes:
  backend_data:
  backend_uploads:

networks:
  agri_network:
    driver: bridge
